stages:
  - lint
  - build
  - test
  - security
  - publish

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.node-job:
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@9.15.0 --activate
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/

lint:
  extends: .node-job
  stage: lint
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec astro check

build:
  extends: .node-job
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

test:
  extends: .node-job
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm test

security:
  stage: security
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TRIVY_VERSION: "0.70.0"
  before_script:
    - wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xzC /usr/local/bin trivy
  script:
    - docker build -t cicd-talk-demo:scan .
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format table cicd-talk-demo:scan

publish:
  stage: publish
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
